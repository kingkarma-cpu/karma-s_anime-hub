  </div>

  <!-- SCRIPT -->

  <script src="script.js"></script>

  <script>
  document.addEventListener("DOMContentLoaded", () => {

    // Get selected anime
    const name = localStorage.getItem("selectedAnime");

    if (!name) {
      document.getElementById("animeTitle").textContent =
        "No anime selected";
      return;
    }

    // Find anime from script.js
    const anime = allAnime.find(a => a.name === name);

    if (!anime) {
      document.getElementById("animeTitle").textContent =
        "Anime not found";
      return;
    }


    // -------------------------
    // ANIME INFORMATION
    // -------------------------

    document.title = anime.name + " | Karma's Hub";

    document.getElementById("animeImage").src = anime.image;

    document.getElementById("animeTitle").textContent = anime.name;

    document.getElementById("animeDesc").textContent =
      anime.desc || "No description available.";


    // -------------------------
    // TRAILER
    // -------------------------

    const trailerContainer =
      document.getElementById("trailerContainer");

    if (anime.trailer) {

      let trailerURL = anime.trailer
        .replace("youtu.be/", "www.youtube.com/embed/")
        .replace("watch?v=", "embed/")
        .split("&")[0];

      trailerContainer.innerHTML = `
        <iframe
          src="${trailerURL}"
          width="100%"
          height="300"
          frameborder="0"
          allowfullscreen>
        </iframe>
      `;

    } else {

      trailerContainer.innerHTML =
        "<p style='color:gray;'>No trailer available</p>";

    }


    // -------------------------
    // EPISODES
    // -------------------------

    const episodesBtn =
      document.getElementById("episodesBtn");

    const episodesOptions =
      document.getElementById("episodesOptions");


    // If anime has no episodes
    if (!anime.episodes || anime.episodes.length === 0) {

      episodesBtn.style.display = "none";

    } else {

      episodesBtn.addEventListener("click", () => {

        // Close episode list
        if (episodesOptions.style.display === "block") {

          episodesOptions.style.display = "none";
          return;

        }


        // Open episode list
        episodesOptions.style.display = "block";

        episodesOptions.innerHTML = "";


        // Create episode buttons
        anime.episodes.forEach((episode) => {

          const button =
            document.createElement("button");

          button.textContent =
            "Episode " + episode.number;


          button.addEventListener("click", () => {

            // Save selected episode
            localStorage.setItem(
              "selectedEpisode",
              JSON.stringify(episode)
            );


            // Go to watch page
            window.location.href =
              "watch.html?id=" +
              encodeURIComponent(anime.name);

          });


          episodesOptions.appendChild(button);

        });

      });

    }


    // -------------------------
    // FAVORITES
    // -------------------------

    const favBtn =
      document.querySelector(".fav-btn");

    favBtn.addEventListener("click", () => {

      const favoriteAnime = {

        name:
          document.getElementById("animeTitle").innerText,

        image:
          document.getElementById("animeImage").src

      };


      let favorites =
        JSON.parse(
          localStorage.getItem("favs")
        ) || [];


      const alreadyExists =
        favorites.some(
          a => a.name === favoriteAnime.name
        );


      if (alreadyExists) {

        alert("Already in favorites ❤️");
        return;

      }


      favorites.push(favoriteAnime);


      localStorage.setItem(
        "favs",
        JSON.stringify(favorites)
      );


      alert("Added to favorites ❤️");

    });

  });
  </script>

</body>
</html>
