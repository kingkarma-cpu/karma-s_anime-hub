<!DOCTYPE html>
<html>
<head>
  <title>My Favorites</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

<script async="async" data-cfasync="false" src="https://bauval.org/21/682aaffe0e33c956e538f7e3af40cdc1"></script>
<div id="container-682aaffe0e33c956e538f7e3af40cdc1"></div>

</head>
<body>

  <nav>
    <h1>❤️ My Favorite Anime</h1>
  </nav>

  <div class="anime-container" id="favList"></div>

  <div id="favContainer"></div>

  <script>
    const favorites = JSON.parse(localStorage.getItem("favs")) || [];
const container = document.getElementById("favList");

if (!favorites.length) {
  container.innerHTML = "<h2 style='padding:20px'>No favorites yet</h2>";
} else {
  container.innerHTML = favorites.map(anime => `
    <div class="card">
      <img src="${anime.image}">
      <h3>${anime.name}</h3>
    </div>
  `).join("");
}
  </script>

</body>
</html>
