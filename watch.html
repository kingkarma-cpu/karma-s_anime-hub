<!DOCTYPE html>
<html>
<head>
  <title>Watch Anime | Karma's Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="images/favicon.png?v=999">

  <script async
  src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4589241904256171"
  crossorigin="anonymous">
</script>
</head>

<body>

<nav>
  <h1 onclick="window.location.href='index.html'" style="cursor:pointer;">
    Tempest HUB
  </h1>
</nav>

<main class="watch-page">

  <h1 id="animeTitle">Loading...</h1>

  <h2 id="episodeTitle"></h2>

  <div class="player-actions">
    <button id="fullscreenBtn" type="button">Fullscreen</button>
  </div>

  <div class="video-box">
    <iframe
      id="videoPlayer"
      title="Anime episode player"
      allow="autoplay; picture-in-picture"
      sandbox="allow-scripts allow-same-origin allow-presentation">
    </iframe>
  </div>

  <div id="episodeList"></div>

</main>

<script src="script.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const name = localStorage.getItem("selectedAnime");

  const selectedEpisode =
    JSON.parse(localStorage.getItem("selectedEpisode"));

  const anime = allAnime.find(a => a.name === name);

  if (!anime) {
    document.getElementById("animeTitle").textContent =
      "Anime not found";
    return;
  }

  document.getElementById("animeTitle").textContent =
    anime.name;

  const player =
    document.getElementById("videoPlayer");

  const episodeTitle =
    document.getElementById("episodeTitle");

  const fullscreenButton =
    document.getElementById("fullscreenBtn");

  const videoBox =
    document.querySelector(".video-box");

  const episodeList =
    document.getElementById("episodeList");

  const requestFullscreen =
    videoBox.requestFullscreen?.bind(videoBox) ||
    videoBox.webkitRequestFullscreen?.bind(videoBox);

  if (requestFullscreen) {
    fullscreenButton.addEventListener("click", async () => {
      try {
        const isFullscreen =
          document.fullscreenElement === videoBox ||
          document.webkitFullscreenElement === videoBox;

        if (isFullscreen) {
          const exitFullscreen =
            document.exitFullscreen?.bind(document) ||
            document.webkitExitFullscreen?.bind(document);

          await exitFullscreen?.();
        } else {
          await requestFullscreen();
        }
      } catch (error) {
        console.error("Fullscreen request failed:", error);
      }
    });

    const updateFullscreenLabel = () => {
      const isFullscreen =
        document.fullscreenElement === videoBox ||
        document.webkitFullscreenElement === videoBox;

      fullscreenButton.textContent =
        isFullscreen ? "Exit fullscreen" : "Fullscreen";
    };

    document.addEventListener("fullscreenchange", updateFullscreenLabel);
    document.addEventListener("webkitfullscreenchange", updateFullscreenLabel);
  } else {
    fullscreenButton.hidden = true;
  }


  // Load selected episode
  function loadEpisode(episode) {

    if (!episode) return;

    episodeTitle.textContent =
      "Episode " + episode.number;

    player.src = episode.url;

    localStorage.setItem(
      "selectedEpisode",
      JSON.stringify(episode)
    );
  }


  // Create episode buttons
  if (anime.episodes) {

    anime.episodes.forEach((episode) => {

      const button =
        document.createElement("button");

      button.textContent =
        "Episode " + episode.number;

      button.onclick = () => {
        loadEpisode(episode);
      };

      episodeList.appendChild(button);

    });

  }


  // Load the episode selected from anime.html
  if (selectedEpisode) {

    const episode =
      anime.episodes.find(
        ep => ep.number === selectedEpisode.number
      );

    if (episode) {
      loadEpisode(episode);
    }

  } else if (anime.episodes && anime.episodes.length > 0) {

    loadEpisode(anime.episodes[0]);

  }

});
</script>

</body>
</html>
