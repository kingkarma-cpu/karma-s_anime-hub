<!DOCTYPE html>
<html>
<head>
  <title>Watch Anime | Karma's Hub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="images/favicon.png?v=999">
</head>

<body>

<nav>
  <h1 onclick="window.location.href='index.html'" style="cursor:pointer;">
    Tempest HUB
  </h1>
</nav>

<main class="watch-page">

  <h1 id="animeTitle">Loading...</h1>

  <h2 id="episodeTitle"></h2>

  <div class="video-box">
    <iframe
      id="videoPlayer"
      width="100%"
      height="500"
      frameborder="0"
      allowfullscreen>
    </iframe>
  </div>

  <div id="episodeList"></div>

  <p>
    Video content is provided by the external video source.
  </p>

</main>

<script src="script.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const name = localStorage.getItem("selectedAnime");

  const selectedEpisode =
    JSON.parse(localStorage.getItem("selectedEpisode"));

  const anime = allAnime.find(a => a.name === name);

  if (!anime) {
    document.getElementById("animeTitle").textContent =
      "Anime not found";
    return;
  }

  document.getElementById("animeTitle").textContent =
    anime.name;

  const player =
    document.getElementById("videoPlayer");

  const episodeTitle =
    document.getElementById("episodeTitle");

  const episodeList =
    document.getElementById("episodeList");


  // Load selected episode
  function loadEpisode(episode) {

    if (!episode) return;

    episodeTitle.textContent =
      "Episode " + episode.number;

    player.src = episode.url;

    localStorage.setItem(
      "selectedEpisode",
      JSON.stringify(episode)
    );
  }


  // Create episode buttons
  if (anime.episodes) {

    anime.episodes.forEach((episode) => {

      const button =
        document.createElement("button");

      button.textContent =
        "Episode " + episode.number;

      button.onclick = () => {
        loadEpisode(episode);
      };

      episodeList.appendChild(button);

    });

  }


  // Load the episode selected from anime.html
  if (selectedEpisode) {

    const episode =
      anime.episodes.find(
        ep => ep.number === selectedEpisode.number
      );

    if (episode) {
      loadEpisode(episode);
    }

  } else if (anime.episodes && anime.episodes.length > 0) {

    loadEpisode(anime.episodes[0]);

  }

});
</script>

</body>
</html>
